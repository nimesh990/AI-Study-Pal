<!DOCTYPE html>
<html>
<head>
    <title>API Quiz - Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🎓 AI Study Pal</a>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h1 class="card-title">📝 Quiz - {{ subject|title }}</h1>
      <p class="text-muted">Answer all {{ questions|length }} questions and submit</p>

      <form action="/api_quiz_result" method="POST">
        <input type="hidden" name="subject" value="{{ subject }}">
        <input type="hidden" name="total" value="{{ questions|length }}">

        {% for q in questions %}
          <div class="card mb-3" style="border-left: 4px solid #4f46e5;">
            <div class="card-body">
              <h5 class="card-title">Question {{ loop.index }}</h5>
              <p class="fw-bold">{{ q.q }}</p>

              <input type="hidden" name="text_{{ q.id }}" value="{{ q.q }}">
              <input type="hidden" name="ans_{{ q.id }}" value="{{ q.answer }}">

              <div class="mt-3">
                {% for opt in q.options %}
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="{{ q.id }}" id="q{{ q.id }}_{{ loop.index }}" value="{{ opt }}" required>
                    <label class="form-check-label" for="q{{ q.id }}_{{ loop.index }}">
                      {{ opt }}
                    </label>
                  </div>
                {% endfor %}
              </div>
            </div>
          </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-success flex-fill">Submit Quiz</button>
          <a href="/api_quiz" class="btn btn-outline-secondary">Change Subject</a>
          <a href="/" class="btn btn-outline-secondary">Home</a>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
