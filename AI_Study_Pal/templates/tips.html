<!DOCTYPE html>
<html>
<head>
    <title>Study Tips Generator</title>
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
      crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🎓 AI Study Pal</a>
    <div class="d-flex">
      <a href="/" class="btn btn-sm btn-outline-light">🏠 Home</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h1 class="card-title text-center mb-1">💡 Study Tips Generator</h1>
      <p class="text-center text-muted mb-4">Get smart tips from your study content</p>

      <form action="/tips" method="POST">
        <div class="mb-3">
          <label class="form-label">Study text (notes, chapter summary, etc.)</label>
          <textarea name="text" rows="8" class="form-control" required>{{ text }}</textarea>
        </div>
        <button type="submit" class="btn btn-primary">Generate Tips</button>
        <a href="/" class="btn btn-secondary ms-2">Back to Home</a>
      </form>

      {% if tips %}
        <h2 class="h4 mt-4">Tips</h2>
        <ul class="list-group">
          {% for t in tips %}
            <li class="list-group-item">{{ t }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
