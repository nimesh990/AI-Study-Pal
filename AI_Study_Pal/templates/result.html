<!DOCTYPE html>
<html>
<head>
  <title>Study Plan Result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🎓 AI Study Pal</a>
    <div class="d-flex">
      <a href="/" class="btn btn-sm btn-outline-light">🏠 Home</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h1 class="card-title text-center mb-1">✅ Your Study Plan</h1>
      <p class="text-center text-muted mb-4">Successfully generated your personalized study schedule</p>

      <div class="alert alert-info mt-3">
        {{ plan }}
      </div>

      <h2 class="h4 mt-4">Schedule</h2>
      <ul class="list-group">
        {% for line in schedule %}
          <li class="list-group-item">{{ line }}</li>
        {% endfor %}
      </ul>

      <div class="mt-4">
        <a href="/download_ics" class="btn btn-success me-2">Download Calendar (.ics)</a>
        <a href="/download_pdf" class="btn btn-danger me-2">Download PDF</a>
        <a href="/download_docx" class="btn btn-primary me-2">Download DOCX</a>
        <a href="/download_pptx" class="btn btn-warning me-2">Download PPTX</a>
        <a href="/" class="btn btn-secondary">Back to Home</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
