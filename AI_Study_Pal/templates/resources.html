<!DOCTYPE html>
<html>
<head>
    <title>Resource Suggestions</title>
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
      crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">🎓 AI Study Pal</a>
    <div class="d-flex">
      <a href="/" class="btn btn-sm btn-outline-light">🏠 Home</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h1 class="card-title text-center mb-1">📚 Resource Suggestions</h1>
      <p class="text-center text-muted mb-4">Find curated learning resources for your subject</p>

      <form action="/resources" method="POST">
        <div class="mb-3">
          <label class="form-label">Enter Subject (e.g., math, physics, chemistry, computer science)</label>
          <input type="text" name="subject" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Get Resources</button>
        <a href="/" class="btn btn-secondary ms-2">Back to Home</a>
      </form>

      {% if suggestions %}
        <h2 class="h4 mt-4">Suggested Resources</h2>
        <ul class="list-group">
          {% for s in suggestions %}
            {% if s.startswith("http") %}
              <li class="list-group-item">
                <a href="{{ s }}" target="_blank">{{ s }}</a>
              </li>
            {% else %}
              <li class="list-group-item">{{ s }}</li>
            {% endif %}
          {% endfor %}
        </ul>
      {% endif %}
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
